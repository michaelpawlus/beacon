name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # scraping (httpx + bs4) is needed at collection time: the scraper
          # test modules import beacon.scrapers.*, which import httpx at module
          # top level. The calls themselves are mocked, so the suite stays
          # hermetic. Other extras (llm/docs/notifications) are lazy-imported
          # and mocked in tests, so they are not required here.
          pip install -e ".[dev,scraping]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        run: pytest -m "not network" -q
