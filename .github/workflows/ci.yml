name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # .python-version pins 3.12 for local work; the matrix still proves the
        # whole requires-python range, so the pin stays a convenience rather
        # than a constraint the code can quietly grow to depend on.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        # v7 is the newest *floating* major tag astral-sh publishes; v8/v9
        # exist only as exact versions (v9.0.0), so `@v9` does not resolve.
        # v7 already runs on node24, which is the point — v6 tripped the
        # Node 20 deprecation warning on every run.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked fails the build on a stale uv.lock instead of silently
      # re-resolving, so a dependency change without a committed lock is caught
      # here rather than diverging per-machine.
      #
      # The dev group carries beacon[scraping] because the scraper test modules
      # import httpx at collection time. The calls themselves are mocked, so the
      # suite stays hermetic. The other extras (llm/docs/notifications) are
      # lazy-imported and mocked in tests, so they are not installed here.
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -m "not network" -q
